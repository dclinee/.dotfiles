# Codecov 配置
# 文档: https://docs.codecov.com/docs/codecovyml-reference

coverage:
  status:
    project:
      default:
        # 项目整体覆盖率目标
        target: 70%
        threshold: 5%    # 允许下降 5%
        if_ci_failed: error
    patch:
      default:
        # 新增代码覆盖率目标
        target: 80%
        threshold: 5%

  # 覆盖率范围标记
  range: "60..90"
  # 精度：小数点后 1 位
  precision: 1
  # 取整方式：down
  round: down

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

# 忽略不需要统计覆盖率的路径
ignore:
  - "emacs/elpa*/**"
  - "~/**"
  - ".git/**"
  - "docs/**"
  - "*.md"
  - "*.txt"
  - "*.toml"
  - "*.yml"
  - "*.yaml"
  - "*.json"
  - "Makefile"
  - "Dockerfile*"

# 标记不同类型的测试
flag_coverage:
  default:
    paths:
      - "lib/**"
      - "zsh/**"
      - "git/**"
      - "vim/**"
      - "wezterm/**"
      - "brew/**"
      - "python/**"
      - "rust/**"
      - "tmux/**"
      - "emacs/**"
      - "bootstrap.sh"
      - "validate.sh"
