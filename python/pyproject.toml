[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dotfiles-python"
version = "0.1.0"
description = "Python development environment for dotfiles"
readme = "README.md"
authors = [{ "name" = "dclinee", "email" = "dengchanglin8@outlook.com" }]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["dotfiles", "python", "development", "environment"]
dependencies = [
    # 从requirements.txt读取的依赖项
    # 如果有依赖项，在此处列出
]
requires-python = ">=3.7"

[project.urls]
homepage = "https://github.com/dclinee/dotfiles"
repository = "https://github.com/dclinee/dotfiles"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["*", "*.*"]
exclude = ["tests", "tests.*"]
