# ======================
# Tmux 配置
# ======================
#
# 安装: ln -sf ~/.dotfiles/tmux/.tmux.conf ~/.tmux.conf
#
# 常用快捷键:
#   前缀键: Ctrl-a (替代默认 Ctrl-b)
#   |       - 垂直分屏
#   -       - 水平分屏
#   r       - 重载配置
#   h/j/k/l - 窗格导航 (Vim 风格)

# --- 基础设置 ---
# 前缀键改为 Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 启用鼠标
set -g mouse on

# 256 色支持（tmux-256color 支持 italic/truecolor，screen-256color 不支持 italic）
# 注：若 terminfo 中无 tmux-256color，运行 infocmp tmux-256color >/dev/null 2>&1 || tic -e tmux-256color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 历史记录
set -g history-limit 100000

# 基础索引从 1 开始
set -g base-index 1
setw -g pane-base-index 1

# 重编号窗口
set -g renumber-windows on

# 减少延迟
set -sg escape-time 0

# 自动重载配置
bind r source-file ~/.tmux.conf \; display "配置已重载!"

# --- 分屏 ---
# 使用更直观的 | 和 - 分屏
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新窗口保持当前路径
bind c new-window -c "#{pane_current_path}"

# --- 导航 (Vim 风格) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 窗口导航
bind -r C-h previous-window
bind -r C-l next-window

# 调整窗格大小 (前缀 + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- 复制模式 ---
# Vi 模式
setw -g mode-keys vi

# v 开始选择, y 复制
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard 2>/dev/null || wl-copy 2>/dev/null"

# --- 外观 ---
# 状态栏
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left-length 30
set -g status-right-length 50

# 状态栏内容
set -g status-left "#[fg=cyan,bold] #S "
set -g status-right "#[fg=yellow] %Y-%m-%d %H:%M "

# 窗口样式
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=black,bg=cyan,bold] #I:#W "

# 窗格边框
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=cyan"

# --- 插件 (TPM) ---
# 安装 TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# 安装插件: 前缀 + I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum 自动恢复
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# 初始化 TPM (保持在最后一行)
if-shell "test -f ~/.tmux/plugins/tpm/tpm" "run -b ~/.tmux/plugins/tpm/tpm"
