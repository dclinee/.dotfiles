name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          format: gcc
          ignore_paths: './.git ./emacs/elpa* ./~'
          # 排除被 source 的库文件（无 shebang 执行上下文）和第三方脚本
          ignore_names: '_common.sh'

  syntax-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zsh
        run: |
          if [[ "$(uname -s)" == "Darwin" ]]; then
            brew install zsh
          else
            sudo apt-get update && sudo apt-get install -y zsh
          fi

      - name: Bash syntax check
        run: |
          find . -name "*.sh" -not -path "./.git/*" | while read f; do
            bash -n "$f" || exit 1
          done

      - name: Zsh syntax check
        run: |
          find . -name "*.zsh" -not -path "./.git/*" -o -name ".zshrc" -o -name ".zshenv" | while read f; do
            zsh -n "$f" || exit 1
          done

      - name: Makefile syntax check
        run: make -n help

  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run validate.sh
        run: ./validate.sh

      - name: Run static tests
        run: ./test_install.sh static

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f Dockerfile.test -t dotfiles-test .

      - name: Run integration tests
        run: docker run --rm dotfiles-test
