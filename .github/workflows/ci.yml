name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          format: gcc
          ignore_paths: './.git ./emacs/elpa* ./~'
          # 排除被 source 的库文件（无 shebang 执行上下文）和第三方脚本
          ignore_names: '_common.sh'

  syntax-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zsh
        run: |
          if [[ "$(uname -s)" == "Darwin" ]]; then
            brew install zsh
          else
            sudo apt-get update && sudo apt-get install -y zsh
          fi

      - name: Bash syntax check
        run: |
          find . -name "*.sh" -not -path "./.git/*" | while read f; do
            bash -n "$f" || exit 1
          done

      - name: Zsh syntax check
        run: |
          find . -name "*.zsh" -not -path "./.git/*" -o -name ".zshrc" -o -name ".zshenv" | while read f; do
            zsh -n "$f" || exit 1
          done

      - name: Makefile syntax check
        run: make -n help

      - name: PowerShell syntax check
        # runner 预装 pwsh；用 AST 解析检查所有 .ps1（只解析不执行），无 pwsh 时跳过
        run: |
          if ! command -v pwsh > /dev/null 2>&1; then
            echo "pwsh 不可用，跳过"
            exit 0
          fi
          pwsh -NoProfile -Command '
            $failed = 0
            Get-ChildItem -Recurse -Filter *.ps1 -File |
              Where-Object { $_.FullName -notmatch "[\\/]\.git[\\/]" } |
              ForEach-Object {
                $tokens = $null; $errors = $null
                [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
                if ($errors.Count -gt 0) {
                  Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
                  $failed++
                }
              }
            exit $failed
          '

  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run validate.sh
        run: ./validate.sh

      - name: Run static tests
        run: ./tests/test_install.sh static

      - name: Module health checks (check.sh)
        run: |
          # check.sh 为运行时状态体检：CI 干净环境缺少 brew/wezterm 等工具属预期，
          # 用 || true 容错避免误红；所有输出仍完整保留在日志中，结构性错误可见。
          for m in brew git tmux vim zsh ssh pwsh; do
            echo "::group::$m/check.sh"
            bash "$m/check.sh" || true
            echo "::endgroup::"
          done

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache kcov and apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            ~/.cache/kcov
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/*.sh', '**/*.zsh') }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh kcov

      - name: Run tests with kcov coverage
        run: |
          mkdir -p coverage
          kcov --include-pattern=.sh,.zsh \
               --exclude-pattern=.git,elpa,~,coverage \
               coverage ./tests/test_install.sh static 2>&1 || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false
          verbose: true

      - name: Print coverage summary
        run: |
          if [[ -f coverage/test_install.sh/kcov-results.json ]]; then
            python3 -c "
import json, sys
with open('coverage/test_install.sh/kcov-results.json') as f:
    data = json.load(f)
cov = data.get('percent_covered', 0)
covered = data.get('covered_lines', 0)
total = data.get('total_lines', 0)
print(f'Code Coverage: {cov:.1f}% ({covered}/{total} lines)')
"
          else
            echo "Coverage report generated in coverage/"
            ls -la coverage/ || true
          fi

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('docker/Dockerfile.ci') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ci
          tags: dotfiles-test
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run integration tests
        run: docker run --rm dotfiles-test
