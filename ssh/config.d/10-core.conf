# ======================
# SSH 通用默认值（所有平台共享）
# ======================

Host *
    # --- 连接保活 ---
    # 每 30s 发送心跳，连续 3 次无响应则断开（防止 NAT 超时掉线）
    ServerAliveInterval 30
    ServerAliveCountMax 3
    TCPKeepAlive yes

    # --- 连接复用 ---
    # 多次连接同一主机复用已有通道（需要 ~/.ssh/sockets 目录，install.sh 自动创建）
    ControlMaster auto
    ControlPath ~/.ssh/sockets/%C
    ControlPersist 10m

    # --- 传输 ---
    # 低速网络收益明显，高速网络无副作用
    Compression yes

    # --- 安全默认 ---
    # 不转发本机 agent（需要时在主机片段或 config.local 中单独开启）
    ForwardAgent no
    # known_hosts 保持明文，便于多台机器间核对与拷贝
    HashKnownHosts no
