# ======================
# 常用主机配置（跨机器共享）
# ======================
#
# 适合放入本文件: 所有机器都会使用的公共主机
# 机器特定的主机（公司内网、临时服务器、不同端口等）请放入 ~/.ssh/config.local
#
# 私钥命名建议: ~/.ssh/id_ed25519_<用途或主机名>，并在对应 Host 中显式指定
#
# 模板示例（按需修改，取消注释后生效）:

# Host myserver
#     HostName YOUR_HOST_IP
#     User YOUR_USER
#     Port 22
#     IdentityFile ~/.ssh/id_ed25519
#
# Host bastion
#     HostName YOUR_BASTION_IP
#     User YOUR_USER
#     # 经跳板机访问内网主机时在目标 Host 中使用:
#     # ProxyJump bastion
