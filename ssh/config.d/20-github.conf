# ======================
# GitHub 加速（SSH over 443 端口）
# ======================
#
# 原理: github.com:22 在部分网络环境下受限或限速，
#       GitHub 官方提供 ssh.github.com:443 备用通道，走 HTTPS 端口更稳定。
#
# 使用前提: 将本机公钥添加到 GitHub 账号
#   GitHub → Settings → SSH and GPG keys → New SSH key
#   查看公钥: cat ~/.ssh/id_ed25519.pub
#   生成密钥: bash ~/.dotfiles/ssh/install.sh --gen-key
#
# 仓库地址改写为 SSH 形式:
#   git remote set-url origin git@github.com:<user>/<repo>.git

Host github.com
    HostName ssh.github.com
    Port 443
    User git
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
