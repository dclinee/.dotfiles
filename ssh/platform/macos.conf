# ======================
# macOS 平台配置
# ======================
#
# IgnoreUnknown 声明让 Linux 上的 OpenSSH 忽略 macOS 专属选项，
# 保证同一份配置在多台机器（macOS / Linux）上通用。
# 本文件在 Linux 上被 Include 时，UseKeychain 会被安全跳过。

Host *
    IgnoreUnknown UseKeychain
    # 密钥口令存入 macOS 钥匙串，避免重复输入
    UseKeychain yes
    AddKeysToAgent yes
    IdentityFile ~/.ssh/id_ed25519
