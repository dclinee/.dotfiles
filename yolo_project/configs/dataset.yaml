# ============================================================
# YOLOv11 数据集配置文件
# 使用方法:
#   1. 将训练图片放入 datasets/images/train/
#   2. 将验证图片放入 datasets/images/val/
#   3. 将对应的 YOLO 格式标注文件放入 datasets/labels/train/ 和 datasets/labels/val/
#   4. 修改下方 nc 和 names 为你的实际类别
# ============================================================

# 数据集根目录 (相对于本文件的路径)
path: ../datasets

# 训练集
train: images/train

# 验证集
val: images/val

# 测试集 (可选)
# test: images/test

# ============================================================
# 类别配置 - 请修改为你的实际类别
# ============================================================
# 类别数量
nc: 2

# 类别名称列表 (索引从0开始)
names:
  0: cat
  1: dog