# ============================================================
# 智慧工地 - 数据集配置
# 目标检测类别: 安全帽、反光衣、人员、车辆、烟雾/火焰
# ============================================================

path: ../datasets

train: images/train
val: images/val

# 类别数量
nc: 7

# 类别名称
names:
  0: person          # 人员
  1: helmet          # 安全帽
  2: no_helmet       # 未戴安全帽
  3: vest            # 反光衣
  4: no_vest         # 未穿反光衣
  5: vehicle         # 工程车辆
  6: smoke_fire      # 烟雾/火焰